name: Build APK & IPA

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # GROQ_API_KEY (repo secret) is baked in at build time for Mobina;
      # if the secret is missing the app still works (key can be typed in
      # Settings > Model).
      - name: Build release APK
        run: flutter build apk --release --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ipa:
    name: iOS (simulator build + best-effort unsigned device archive)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # CI has no Apple Developer account, and the flutter tool rejects any
      # DEVICE build without a selected Development Team (even with
      # --no-codesign). Building for the SIMULATOR instead needs no code
      # signing at all and still compiles the full iOS target in release
      # (Dart + Swift + all plugins) - which is what this job verifies.
      - name: Build iOS release (simulator, no codesign)
        run: flutter build ios --release --no-codesign --simulator --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - name: Package simulator app
        run: |
          APP=$(find build/ios -type d -name Runner.app | head -1)
          test -n "$APP" || { echo "Runner.app not found"; exit 1; }
          echo "Built simulator app: $APP"
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/build/ios-simulator-Runner.app.zip" Runner.app)

      # Best effort: unsigned device-slice archive via xcodebuild with
      # signing fully disabled (no Development Team needed for the archive
      # itself). If this fails, the simulator build above already proved
      # the iOS target compiles - do not block the pipeline.
      - name: Xcode device archive (no signing, best effort)
        continue-on-error: true
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/ios/Runner.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export unsigned device IPA (best effort)
        continue-on-error: true
        run: |
          cat > build/ios/ExportOptions-unsigned.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa-unsigned \
            -exportOptionsPlist build/ios/ExportOptions-unsigned.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-simulator-app
          path: build/ios-simulator-Runner.app.zip
          if-no-files-found: error

      - name: Upload Xcode device archive (best effort)
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-xcarchive
          path: build/ios/Runner.xcarchive
          if-no-files-found: warn

      - name: Upload unsigned IPA (re-sign before installing on a device)
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-ipa-unsigned
          path: build/ios/ipa-unsigned/Runner.ipa
          if-no-files-found: warn
