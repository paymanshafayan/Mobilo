name: Build APK & IPA

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # GROQ_API_KEY (repo secret) is baked in at build time for Mobina;
      # if the secret is missing the app still works (key can be typed in
      # Settings > Model).
      - name: Build release APK
        run: flutter build apk --release --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ipa:
    name: iOS (Release device build, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # No Apple Developer account in CI. The flutter tool rejects device
      # builds without a selected Development Team (even with --no-codesign),
      # and Release builds are not supported for simulators at all, so we
      # skip `flutter build ios` and archive directly with xcodebuild,
      # with code signing fully disabled. The Flutter build phases still
      # run inside xcodebuild (via xcode_backend.sh), so the full Release
      # iOS target (Dart AOT + Swift + all plugins) gets compiled.
      - name: Resolve iOS dependencies (CocoaPods + SPM)
        run: |
          cd ios
          pod install --repo-update

      - name: Xcode device archive (Release, no signing)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/ios/Runner.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export unsigned IPA
        continue-on-error: true
        run: |
          cat > build/ios/ExportOptions-unsigned.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa-unsigned \
            -exportOptionsPlist build/ios/ExportOptions-unsigned.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Xcode archive (always available)
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-xcarchive
          path: build/ios/Runner.xcarchive
          if-no-files-found: error

      - name: Upload unsigned IPA (re-sign before installing on a device)
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-ipa-unsigned
          path: build/ios/ipa-unsigned/Runner.ipa
          if-no-files-found: warn
