name: Build APK & IPA

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ipa:
    name: iOS (unsigned IPA + archive)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # Flutter builds the app and resolves SPM/CocoaPods dependencies.
      # (flutter_local_notifications does not support SPM yet - warning only for now)
      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      # NOTE: Flutter 3.47's `flutter build ipa --no-codesign` does NOT produce
      # an IPA (it only produces an xcarchive). So we archive + export directly
      # with xcodebuild, disabling code signing - no Development Team required.
      - name: Xcode archive (no signing)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/ios/Runner.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export unsigned IPA
        continue-on-error: true
        run: |
          cat > build/ios/ExportOptions-unsigned.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa-unsigned \
            -exportOptionsPlist build/ios/ExportOptions-unsigned.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Xcode archive (always available)
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-xcarchive
          path: build/ios/Runner.xcarchive
          if-no-files-found: error

      - name: Upload unsigned IPA (re-sign before installing on a device)
        uses: actions/upload-artifact@v4
        with:
          name: mobilo-ios-ipa-unsigned
          path: build/ios/ipa-unsigned/Runner.ipa
          if-no-files-found: warn
